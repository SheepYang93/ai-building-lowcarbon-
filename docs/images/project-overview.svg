<g filter="url(#shadow)">
<rect x="60" y="250" width="220" height="340" rx="20" fill="#fff"/><rect x="310" y="250" width="220" height="340" rx="20" fill="#fff"/><rect x="560" y="250" width="220" height="340" rx="20" fill="#fff"/><rect x="810" y="250" width="220" height="340" rx="20" fill="#fff"/><rect x="1060" y="250" width="220" height="340" rx="20" fill="#fff"/><rect x="1310" y="250" width="220" height="340" rx="20" fill="#fff"/>
</g>
<g font-family="Arial,'Noto Sans SC',sans-serif" text-anchor="middle">
<g><rect x="60" y="250" width="220" height="72" rx="20" fill="#2563eb"/><text x="170" y="295" font-size="26" font-weight="700" fill="#fff">01 数据输入</text><text x="170" y="365" font-size="19" fill="#2563eb">MULTI-SOURCE DATA</text><text x="170" y="415" font-size="20" fill="#233e52">建筑 / 日期 / 电表</text><text x="170" y="455" font-size="20" fill="#233e52">天气与运行信息</text><rect x="90" y="500" width="160" height="48" rx="12" fill="#dbeafe"/><text x="170" y="531" font-size="18" fill="#1d4ed8">质量校验 · 清洗</text></g>
<g><rect x="310" y="250" width="220" height="72" rx="20" fill="#0d9488"/><text x="420" y="295" font-size="26" font-weight="700" fill="#fff">02 AI 预测</text><text x="420" y="365" font-size="19" fill="#0d9488">ENERGY FORECAST</text><polyline points="350,470 375,440 400,455 425,400 450,420 490,375" fill="none" stroke="#0d9488" stroke-width="5" stroke-linecap="round"/><text x="420" y="515" font-size="20" fill="#233e52">ExtraTrees · 时序特征</text><text x="420" y="550" font-size="18" fill="#64748b">历史信息驱动预测</text></g>
<g><rect x="560" y="250" width="220" height="72" rx="20" fill="#7c3aed"/><text x="670" y="295" font-size="26" font-weight="700" fill="#fff">03 异常诊断</text><text x="670" y="365" font-size="19" fill="#7c3aed">ANOMALY DETECTION</text><circle cx="635" cy="440" r="12" fill="#c4b5fd"/><circle cx="670" cy="420" r="12" fill="#c4b5fd"/><circle cx="705" cy="450" r="12" fill="#c4b5fd"/><circle cx="740" cy="405" r="14" fill="#ef4444"/><text x="670" y="515" font-size="20" fill="#233e52">Robust Median / MAD</text><text x="670" y="550" font-size="18" fill="#64748b">异常候选 · 能耗画像</text></g>
<g><rect x="810" y="250" width="220" height="72" rx="20" fill="#0891b2"/><text x="920" y="295" font-size="26" font-weight="700" fill="#fff">04 节能决策</text><text x="920" y="365" font-size="19" fill="#0891b2">EFFICIENCY ACTION</text><path d="M890 425h60l-30 55z" fill="#67e8f9"/><path d="M920 405v75" stroke="#0891b2" stroke-width="5"/><text x="920" y="515" font-size="20" fill="#233e52">反事实筛选 · 行动映射</text><text x="920" y="550" font-size="18" fill="#64748b">形成可审查的干预假设</text></g>
<g><rect x="1060" y="250" width="220" height="72" rx="20" fill="#ea580c"/><text x="1170" y="295" font-size="26" font-weight="700" fill="#fff">05 碳排核算</text><text x="1170" y="365" font-size="19" fill="#ea580c">CARBON ACCOUNTING</text><rect x="1115" y="430" width="35" height="65" rx="5" fill="#fed7aa"/><rect x="1165" y="395" width="35" height="100" rx="5" fill="#fb923c"/><rect x="1215" y="455" width="35" height="40" rx="5" fill="#fdba74"/><text x="1170" y="530" font-size="20" fill="#233e52">电力因子 · Scope 2</text><text x="1170" y="560" font-size="18" fill="#64748b">条件性 CO₂ 情景</text></g>
<g><rect x="1310" y="250" width="220" height="72" rx="20" fill="#16a34a"/><text x="1420" y="295" font-size="26" font-weight="700" fill="#fff">06 现场验证</text><text x="1420" y="365" font-size="19" fill="#16a34a">FIELD VALIDATION</text><circle cx="1420" cy="440" r="42" fill="#dcfce7"/><path d="M1398 440l15 15 30-34" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="1420" y="515" font-size="20" fill="#233e52">Treatment / Control</text><text x="1420" y="550" font-size="18" fill="#64748b">DID · 稳健性诊断</text></g>
</g>
