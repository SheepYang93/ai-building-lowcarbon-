<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4fbff"/><stop offset="1" stop-color="#e8f7f1"/></linearGradient><linearGradient id="head" x2="1"><stop stop-color="#075985"/><stop offset="1" stop-color="#047857"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f766e" flood-opacity=".12"/></filter></defs>
<rect width="1600" height="760" rx="28" fill="url(#bg)"/>
<circle cx="1450" cy="90" r="180" fill="#d1fae5" opacity=".45"/><circle cx="80" cy="700" r="230" fill="#dbeafe" opacity=".5"/>
<text x="80" y="95" font-family="Arial,'Noto Sans SC',sans-serif" font-size="48" font-weight="700" fill="#0f2f45">AI 建筑能耗低碳决策系统</text>
<text x="82" y="142" font-family="Arial,sans-serif" font-size="23" fill="#527084">BUILDING ENERGY INTELLIGENCE · FROM DATA TO FIELD EVIDENCE</text>
<text x="80" y="190" font-family="Arial,'Noto Sans SC',sans-serif" font-size="22" fill="#315b69">预测能耗 · 识别异常 · 筛选节能方案 · 核算碳排 · 验证现场效果</text>
