<g fill="#64748b"><path d="M284 410h20l-8-9 16 9-16 9 8-9h-20z"/><path d="M534 410h20l-8-9 16 9-16 9 8-9h-20z"/><path d="M784 410h20l-8-9 16 9-16 9 8-9h-20z"/><path d="M1034 410h20l-8-9 16 9-16 9 8-9h-20z"/><path d="M1284 410h20l-8-9 16 9-16 9 8-9h-20z"/></g>
